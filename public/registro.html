<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en ParqueoAirbin">
    <title>Registro - ParqueoAirbin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --dark: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
            --accent: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
        }

        /* Navbar */
        .navbar-custom {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 1rem 0;
        }
        .navbar-custom .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .navbar-custom .navbar-brand span { color: var(--accent); }
        .navbar-custom .nav-link {
            color: var(--text);
            font-weight: 500;
            transition: color 0.2s;
        }
        .navbar-custom .nav-link:hover { color: var(--accent); }

        /* Form Card */
        .form-wrapper {
            max-width: 480px;
            margin: 4rem auto;
            position: relative;
        }
        .form-wrapper::before {
            content: '';
            position: absolute;
            top: -40%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(79,70,229,0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .form-card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 2.5rem;
            position: relative;
            z-index: 1;
        }
        .form-card h2 {
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }
        .form-card .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Inputs */
        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        .form-control-custom {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control-custom:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
        }
        .form-control-custom::placeholder { color: #64748b; }

        .form-select-custom {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            width: 100%;
            appearance: auto;
            transition: border-color 0.2s;
        }
        .form-select-custom:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
        }
        .form-select-custom option {
            background: var(--surface);
            color: var(--text);
        }

        /* Button */
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Alert */
        .alert-custom {
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }
        .alert-danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        /* Link */
        .form-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .form-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .form-link a:hover { text-decoration: underline; }

        /* Footer */
        footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 2rem 0;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Parqueo<span>Airbin</span></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="registro.html">Registro</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container">
        <div class="form-wrapper">
            <div class="form-card">
                <h2>Crear cuenta</h2>
                <p class="subtitle">Regístrate para empezar a usar ParqueoAirbin</p>

                <div id="alertSuccess" class="alert-custom alert-success" role="alert"></div>
                <div id="alertError" class="alert-custom alert-danger" role="alert"></div>

                <form id="registroForm" novalidate>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" id="nombre" class="form-control-custom" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" class="form-control-custom" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" id="contrasena" class="form-control-custom" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label for="rol" class="form-label">Rol</label>
                        <select id="rol" class="form-select-custom">
                            <option value="conductor">Conductor</option>
                            <option value="anfitrion">Anfitrión</option>
                        </select>
                    </div>

                    <button type="submit" id="btnRegistro" class="btn-submit">Crear cuenta</button>
                </form>

                <div class="form-link">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            &copy; 2026 ParqueoAirbin — Todos los derechos reservados.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form          = document.getElementById('registroForm');
        const alertSuccess  = document.getElementById('alertSuccess');
        const alertError    = document.getElementById('alertError');
        const btnRegistro   = document.getElementById('btnRegistro');

        function showAlert(element, message) {
            // Ocultar ambas alertas primero
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
            // Mostrar la indicada
            element.textContent = message;
            element.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre     = document.getElementById('nombre').value.trim();
            const correo     = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const rol        = document.getElementById('rol').value;

            // Validación client-side básica
            if (!nombre || !correo || !contrasena) {
                showAlert(alertError, 'Por favor, completa todos los campos obligatorios.');
                return;
            }
            if (contrasena.length < 6) {
                showAlert(alertError, 'La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            btnRegistro.disabled = true;
            btnRegistro.textContent = 'Registrando...';

            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, correo, contrasena, rol })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert(alertSuccess, `✅ ${data.mensaje} Redirigiendo...`);
                    form.reset();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(alertError, data.mensaje || 'Error al registrar usuario.');
                }
            } catch (err) {
                showAlert(alertError, 'No se pudo conectar con el servidor. Intenta más tarde.');
                console.error(err);
            } finally {
                btnRegistro.disabled = false;
                btnRegistro.textContent = 'Crear cuenta';
            }
        });
    </script>
</body>
</html>
