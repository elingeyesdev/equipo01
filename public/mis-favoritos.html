<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Favoritos - EstAirbnb</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Tema -->
  <link href="/css/dark-theme.css" rel="stylesheet">
</head>

<body class="bg-background text-on-background font-body min-h-screen">

  <!-- 🔥 NAVBAR -->
  <nav class="bg-white/70 backdrop-blur-xl sticky top-0 z-50 shadow-sm">
    <div class="flex justify-between items-center w-full px-6 py-4 max-w-screen-xl mx-auto">

      <div class="text-xl font-black tracking-tighter text-[#002542]">
        EstAirbnb
      </div>

      <div class="hidden md:flex items-center gap-6">

        <a class="text-slate-500 hover:text-slate-800 px-3 py-2" href="/explorar.html">
          Explorar
        </a>

        <a class="text-slate-500 hover:text-slate-800 px-3 py-2" href="/mis-reservas.html">
          Mis Reservas
        </a>

        <!-- ACTIVO -->
        <a class="text-[#002542] border-b-2 border-[#006a62] pb-1" href="/favoritos.html">
          Mis Favoritos
        </a>

        <a class="text-slate-500 hover:text-slate-800 px-3 py-2" href="/configuracion.html">
          Mi Perfil
        </a>

      </div>

      <div class="flex items-center gap-4">
        <button class="text-slate-500 hover:bg-slate-100/50 p-2 rounded-full" id="btnThemeToggle">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- 🔥 CONTENIDO -->
  <main class="max-w-6xl mx-auto px-6 pt-12 pb-20">

    <!-- HEADER -->
    <header class="mb-8">
      <h1 class="text-3xl md:text-4xl font-black text-primary mb-2">
        ❤️ Mis Favoritos
      </h1>
      <p class="text-on-surface-variant text-base">
        Guarda y accede rápidamente a tus garajes preferidos.
      </p>
    </header>

    <!-- GRID MEJORADO -->
    <div id="favoritosGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 justify-items-center">
    </div>

    <!-- EMPTY -->
    <div id="emptyFavoritos" class="hidden text-center py-16">
      <h3 class="text-xl font-bold mb-2">No tienes favoritos aún</h3>
      <p class="text-on-surface-variant mb-6">Guarda garajes desde explorar</p>

      <a href="/explorar.html" class="bg-primary text-white px-6 py-3 rounded-md hover:bg-secondary transition">
        Explorar Garajes
      </a>
    </div>

  </main>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="miToast" class="toast text-bg-dark border-0">
      <div class="d-flex">
        <div class="toast-body" id="toastMensaje"></div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/favoritos-dashboard.js"></script>

</body>

</html>
