<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Favoritos - EstAirbnb</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tus estilos si quieres -->
  <link href="/css/dark-theme.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR (puedes copiar el de explorar si quieres) -->

<div class="container py-4">
  <h1 class="mb-4">❤️ Mis Favoritos</h1>

  <!-- GRID -->
  <div id="favoritosGrid" class="row g-4"></div>

  <!-- ESTADO VACÍO -->
  <div id="emptyFavoritos" class="text-center mt-5 d-none">
    <h4>No tienes favoritos aún</h4>
    <p>Guarda garajes desde explorar</p>
  </div>
</div>

<!-- Toast (reutilizas el mismo) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="miToast" class="toast text-bg-dark border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMensaje"></div>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/favoritos-dashboard.js"></script>

</body>
</html>
