<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalles del espacio de estacionamiento — EstAirbnb, plataforma de alquiler de parqueos privados.">
  <title>Detalle del Parqueo · EstAirbnb</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts — Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Detalle Styles -->
  <link href="/css/detalle.css" rel="stylesheet">
</head>
<body>

  <!-- ==============================
       Top Navigation Bar
  ============================== -->
  <nav class="top-navbar" id="topNavbar">
    <a href="/" class="brand">
      <i class="fa-solid fa-square-parking"></i>
      EstAirbnb
    </a>
    <div class="nav-links">
      <a href="/explorar.html" class="nav-link-custom">
        <i class="fa-solid fa-compass"></i> Explorar
      </a>
      <a href="/configuracion.html" class="nav-link-custom">
        <i class="fa-solid fa-gear"></i> Mi Perfil
      </a>
      <span style="width:1px;height:20px;background:var(--sidebar-border);"></span>
      <button id="btnThemeToggle" class="theme-toggle" title="Cambiar tema">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </nav>

  <!-- ==============================
       Page Content
  ============================== -->
  <div class="detalle-layout">

    <!-- Breadcrumb -->
    <div class="breadcrumb-nav" id="breadcrumb">
      <a href="/explorar.html"><i class="fa-solid fa-arrow-left"></i> Volver a Explorar</a>
      <span class="separator">›</span>
      <span class="current" id="breadcrumbTitle">Detalle del Parqueo</span>
    </div>

    <!-- Loading State -->
    <div class="loading-detalle" id="loadingDetalle">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p>Cargando detalles del parqueo...</p>
    </div>

    <!-- Error State -->
    <div class="error-detalle" id="errorDetalle" style="display:none;">
      <div class="error-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
      <h3>Parqueo no encontrado</h3>
      <p>El espacio que buscas no existe o no está disponible en este momento.</p>
      <a href="/explorar.html" class="btn-volver">
        <i class="fa-solid fa-arrow-left"></i> Volver a Explorar
      </a>
    </div>

    <!-- Detail Content (hidden until loaded) -->
    <div class="detalle-content" id="detalleContent" style="display:none;">

      <!-- Carousel Section -->
      <div class="carousel-section" id="carouselSection">
        <!-- Populated by JS -->
      </div>

      <!-- Info Section -->
      <div class="info-section">
        <div class="info-card">
          <h1 class="garaje-titulo" id="garajeTitulo"></h1>
          <div class="garaje-ubicacion" id="garajeUbicacion">
            <i class="fa-solid fa-location-dot"></i>
            <span id="garajeDireccion"></span>
          </div>

          <hr class="info-divider">

          <div class="detail-items">
            <!-- Precio -->
            <div class="detail-item">
              <div class="detail-item-icon precio">
                <i class="fa-solid fa-tag"></i>
              </div>
              <div class="detail-item-info">
                <span class="detail-item-label">Precio por hora</span>
                <span class="detail-item-value precio-valor" id="garajePrecio"></span>
              </div>
            </div>

            <!-- Tipo Vehiculo -->
            <div class="detail-item">
              <div class="detail-item-icon tipo">
                <i class="fa-solid fa-car" id="tipoIcon"></i>
              </div>
              <div class="detail-item-info">
                <span class="detail-item-label">Tipo de vehículo</span>
                <span class="detail-item-value" id="garajeTipo"></span>
              </div>
            </div>

            <!-- Descripcion -->
            <div class="detail-item" id="descripcionContainer">
              <div class="detail-item-icon desc">
                <i class="fa-solid fa-align-left"></i>
              </div>
              <div class="detail-item-info">
                <span class="detail-item-label">Descripción</span>
                <span class="detail-item-value descripcion-texto" id="garajeDescripcion"></span>
              </div>
            </div>
          </div>

          <!-- CTA Button -->
          <button class="btn-reserva" id="btnReserva">
            <i class="fa-solid fa-calendar-check"></i>
            Solicitar Reserva
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Detalle Logic -->
  <script src="/js/detalle.js"></script>

</body>
</html>
