<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — EstAirbnb</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/login.css" rel="stylesheet">
</head>
<body>

<!-- Mesh gradient canvas -->
<canvas id="bgCanvas"></canvas>

<!-- Glassmorphic card -->
<div class="card">

  <div class="brand">
    <div class="brand-mark">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <path d="M10 8h10c4.42 0 8 3.58 8 8s-3.58 8-8 8h-6v6h-4V8zm4 4v8h6c2.21 0 4-1.79 4-4s-1.79-4-4-4h-6z" fill="white"/>
      </svg>
    </div>
    <div class="brand-name">EstAirbnb</div>
    <div class="brand-sub">Bienvenido de vuelta</div>
  </div>

  <div id="alertBox" class="alert-box">
    <i id="alertIcon" class="fa-solid fa-circle-exclamation"></i>
    <span id="alertMsg"></span>
  </div>

  <form id="loginForm" novalidate>

    <div class="field">
      <label class="field-lbl" for="inpEmail">Correo electrónico</label>
      <input id="inpEmail" type="email" name="email"
             placeholder="tu@ejemplo.com" autocomplete="email" required>
      <span class="field-error" id="errEmail">Ingresa un correo válido.</span>
    </div>

    <div class="field">
      <div class="field-hdr">
        <label class="field-lbl" for="inpPassword">Contraseña</label>
        <a class="link-sm" href="#">¿La olvidaste?</a>
      </div>
      <div class="inp-wrap">
        <input id="inpPassword" type="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required
               style="padding-right:44px">
        <button type="button" id="togglePw" class="btn-eye">
          <i id="eyeIcon" class="fa-solid fa-eye"></i>
        </button>
      </div>
      <span class="field-error" id="errPassword">La contraseña es obligatoria.</span>
    </div>

    <div class="chk-row">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Recordarme por 30 días</label>
    </div>

    <button type="submit" id="btnLogin" class="btn-primary">Iniciar Sesión</button>

  </form>

  <div class="card-footer">
    ¿No tienes cuenta? <a href="/register.html">Regístrate gratis</a>
  </div>

</div>

<script src="/js/mesh-bg.js"></script>
<script src="/js/login.js"></script>
<script src="/js/navbar-badge.js"></script>
</body>
</html>
