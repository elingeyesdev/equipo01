<style>
  body { font-family: 'Inter', sans-serif; }
  /* Clases para integración con login.js */
  .field-error { display: none; margin-top: 0.25rem; font-size: 0.75rem; color: #ba1a1a; font-family: 'Inter', sans-serif;}
  .field-error.show { display: block; }
  .is-invalid { border-bottom-color: #ba1a1a !important; background-color: #ffdad6 !important;}
  .alert-box { display: none; margin-bottom: 1.5rem; padding: 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-family: 'Inter', sans-serif; align-items: flex-start; gap: 0.75rem;}
  .alert-box.error { display: flex; background-color: #ffdad6; color: #93000a; }
  .alert-box.success { display: flex; background-color: #cce8d0; color: #1a7a42; }
  .spinner-border { display: inline-block; width: 1rem; height: 1rem; vertical-align: text-bottom; border: 0.2em solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spinner-border .75s linear infinite; }
  @keyframes spinner-border { to { transform: rotate(360deg); } }
</style>

<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<main class="flex-grow flex flex-col md:flex-row w-full h-screen">
<!-- Left Side: Atmospheric Image -->
<div class="hidden md:block md:w-1/2 lg:w-3/5 h-full relative">
<img alt="Atmospheric smart garage" class="w-full h-full object-cover absolute inset-0 z-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2mlImdj18stt_JyszLtzpgOQrhSM6eg5hxevxw7Lig8qlRqRw_JWMkDDIM7I0d-FNy5Q4e33g7wlg7pjQZ0xdGYKjlqDVwNLiokUfpmF0DrAPZw_2W-pc4FLQ-lq6X6-WAdUMJysAxJUNbdzHp5E_b8dlUqaF_RJz_sgNqUhrOhLbQ_R7rrQH-A5tW65U5-k9ICSokOZLfTX1nkCKTUDdhEuiSg311QDjK7Z1L3gsDJPNsItUeVgS8haTu7txTnOh1ZtNsMAPo_o"/>
<div class="absolute inset-0 bg-gradient-to-r from-primary/80 to-transparent z-10"></div>
<div class="absolute bottom-12 left-12 z-20 max-w-lg text-on-primary">
<h1 class="font-headline text-5xl md:text-6xl font-black tracking-tighter mb-4">EstAirbnb</h1>
<p class="font-body text-xl font-medium text-primary-fixed-dim">Desbloquea la ciudad. Parquéa con autoridad.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 lg:w-2/5 h-full flex items-center justify-center p-6 md:p-12 bg-surface-container-lowest relative">
<!-- Mobile Brand Header -->
<div class="md:hidden absolute top-8 left-6">
<h1 class="font-headline text-3xl font-black tracking-tighter text-primary">EstAirbnb</h1>
</div>
<div class="w-full max-w-md">
<div class="mb-10 text-left">
<h2 class="font-headline text-3xl font-bold text-primary tracking-tight mb-2">Bienvenido de nuevo</h2>
<p class="font-body text-on-surface-variant text-sm">Ingresa tus credenciales para acceder a tu cuenta.</p>
</div>
<!-- Alert Box -->
<div id="alertBox">
<i id="alertIcon" class="fa-solid fa-circle-exclamation mt-1"></i>
<span class="flex-1" id="alertMsg"></span>
</div>
<form class="space-y-6" id="loginForm" novalidate>
<!-- Email Input -->
<div class="relative group">
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-2" for="inpEmail">Correo Electrónico</label>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 text-on-surface py-3 px-4 transition-colors duration-300 placeholder-on-surface-variant/50" id="inpEmail" name="email" placeholder="tu@ejemplo.com" required="" type="email"/>
<span class="field-error" id="errEmail">Ingresa un correo válido.</span>
</div>
<!-- Password Input -->
<div class="relative group">
<div class="flex justify-between items-center mb-2">
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-widest" for="inpPassword">Contraseña</label>
<a class="font-label text-xs font-semibold text-primary hover:text-secondary transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 text-on-surface py-3 px-4 pr-12 transition-colors duration-300 placeholder-on-surface-variant/50" id="inpPassword" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant hover:text-primary focus:outline-none transition-colors" id="togglePw" type="button">
<i class="fa-solid fa-eye" id="eyeIcon"></i>
</button>
</div>
<span class="field-error" id="errPassword">La contraseña es obligatoria.</span>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded-sm border-outline-variant text-secondary focus:ring-secondary focus:ring-offset-0 bg-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 block text-sm font-medium text-on-surface-variant" for="remember">Recordarme por 30 días</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-body font-semibold py-4 px-6 rounded-md hover:from-secondary hover:to-secondary-container hover:text-on-secondary-container transition-all duration-300 shadow-[0px_8px_16px_rgba(0,37,66,0.12)] hover:shadow-[0px_12px_24px_rgba(0,106,98,0.2)] focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 mt-4 text-[15px]" id="btnLogin" type="submit">
  Iniciar Sesión
</button>
</form>
<div class="mt-8 text-center">
<p class="font-body text-sm text-on-surface-variant">
  ¿No tienes una cuenta? 
  <a class="font-semibold text-primary hover:text-secondary transition-colors" href="/register.html">Regístrate</a>
</p>
</div>
</div>
</div>
</main>
<script src="/js/login.js"></script>
<script src="/js/navbar-badge.js"></script>
</body></html>
