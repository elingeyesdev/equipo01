<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en EstAirbnb — la plataforma de alquiler de parqueos.">
  <title>Iniciar Sesión · EstAirbnb</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent:       #1877f2;
      --accent-hover: #166fe5;
      --body-bg:      #f0f2f5;
      --card-border:  #e4e6eb;
      --text-primary: #1c1e21;
      --text-muted:   #65676b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--body-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 60px; height: 60px;
      background: var(--accent);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(24,119,242,0.35);
    }
    .brand h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Card */
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    .auth-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      text-align: center;
    }

    /* Inputs */
    .input-group-custom {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group-custom .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 2;
    }
    .input-group-custom input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.938rem;
      color: var(--text-primary);
      background: #fafbfc;
      transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
    }
    .input-group-custom input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24,119,242,0.15);
      background: #fff;
    }
    .input-group-custom input.is-invalid {
      border-color: #dc3545;
      box-shadow: 0 0 0 3px rgba(220,53,69,0.12);
    }
    .field-error {
      font-size: 0.78rem;
      color: #dc3545;
      margin-top: 4px;
      display: none;
    }
    .field-error.show { display: block; }

    /* Toggle password */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      z-index: 2;
      background: none;
      border: none;
      padding: 0;
    }
    .toggle-pw:hover { color: var(--accent); }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(24,119,242,0.3);
    }
    .btn-submit:active { transform: translateY(0); box-shadow: none; }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    /* Alert */
    .alert-box {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .alert-box.error   { display: flex; background: #fff2f3; color: #c0392b; border: 1.5px solid #f5c6cb; }
    .alert-box.success { display: flex; background: #f0faf4; color: #1a7a42; border: 1.5px solid #b7dfcb; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* Footer link */
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-square-parking"></i></div>
    <h1>EstAirbnb</h1>
    <p>Tu plataforma de alquiler de parqueos</p>
  </div>

  <!-- Card -->
  <div class="auth-card">
    <h2>Iniciar sesión</h2>

    <!-- Alert -->
    <div class="alert-box" id="alertBox">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertMsg"></span>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <!-- Email -->
      <div class="input-group-custom">
        <i class="fa-solid fa-envelope field-icon"></i>
        <input type="email" id="inpEmail" placeholder="Correo electrónico" autocomplete="email" required>
        <span class="field-error" id="errEmail">Ingresa un correo válido.</span>
      </div>

      <!-- Password -->
      <div class="input-group-custom">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="inpPassword" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="togglePw" title="Ver contraseña">
          <i class="fa-solid fa-eye" id="eyeIcon"></i>
        </button>
        <span class="field-error" id="errPassword">La contraseña es obligatoria.</span>
      </div>

      <button type="submit" class="btn-submit" id="btnLogin">
        <i class="fa-solid fa-right-to-bracket"></i>
        Iniciar sesión
      </button>

    </form>

    <div class="divider">o</div>

    <div class="auth-footer">
      ¿No tienes cuenta?
      <a href="/register.html">Regístrate aquí</a>
    </div>
  </div>

  <script>
    const USUARIO_KEY = 'estairbnb_user';

    // Si ya está logueado, redirigir directo
    if (localStorage.getItem(USUARIO_KEY)) {
      window.location.href = '/configuracion.html';
    }

    // Toggle mostrar/ocultar contraseña
    document.getElementById('togglePw').addEventListener('click', () => {
      const inp  = document.getElementById('inpPassword');
      const icon = document.getElementById('eyeIcon');
      const show = inp.type === 'password';
      inp.type   = show ? 'text' : 'password';
      icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.className = `alert-box ${type}`;
      document.getElementById('alertMsg').textContent = msg;
    }
    function hideAlert() {
      document.getElementById('alertBox').className = 'alert-box';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email    = document.getElementById('inpEmail').value.trim();
      const password = document.getElementById('inpPassword').value;

      // Validación
      let valid = true;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('errEmail').classList.add('show');
        document.getElementById('inpEmail').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('errEmail').classList.remove('show');
        document.getElementById('inpEmail').classList.remove('is-invalid');
      }
      if (!password) {
        document.getElementById('errPassword').classList.add('show');
        document.getElementById('inpPassword').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('errPassword').classList.remove('show');
        document.getElementById('inpPassword').classList.remove('is-invalid');
      }
      if (!valid) return;

      const btn = document.getElementById('btnLogin');
      const origHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Verificando...`;

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok && data.status === 'ok') {
          // Guardar sesión en localStorage
          localStorage.setItem(USUARIO_KEY, JSON.stringify(data.data));
          showAlert('¡Bienvenido! Redirigiendo...', 'success');
          setTimeout(() => { window.location.href = '/configuracion.html'; }, 800);
        } else {
          showAlert(data.message || 'Error al iniciar sesión.');
          btn.disabled = false;
          btn.innerHTML = origHTML;
        }
      } catch (err) {
        showAlert('No se pudo conectar con el servidor.');
        btn.disabled = false;
        btn.innerHTML = origHTML;
      }
    });
  </script>

</body>
</html>
