<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en ParqueoAirbin">
    <title>Login - ParqueoAirbin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --dark: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
            --accent: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
        }

        .navbar-custom {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 1rem 0;
        }
        .navbar-custom .navbar-brand {
            font-weight: 700; font-size: 1.4rem; color: #fff; letter-spacing: -0.5px;
        }
        .navbar-custom .navbar-brand span { color: var(--accent); }
        .navbar-custom .nav-link { color: var(--text); font-weight: 500; transition: color 0.2s; }
        .navbar-custom .nav-link:hover { color: var(--accent); }

        .form-wrapper {
            max-width: 440px;
            margin: 5rem auto;
            position: relative;
        }
        .form-wrapper::before {
            content: '';
            position: absolute;
            top: -40%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(79,70,229,0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .form-card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 2.5rem;
            position: relative;
            z-index: 1;
        }
        .form-card h2 { font-weight: 700; font-size: 1.75rem; margin-bottom: 0.25rem; }
        .form-card .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }

        .form-label { font-weight: 600; font-size: 0.875rem; color: #cbd5e1; margin-bottom: 0.4rem; }
        .form-control-custom {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control-custom:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
        }
        .form-control-custom::placeholder { color: #64748b; }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-top: 0.5rem;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert-custom {
            border-radius: 12px; padding: 1rem; font-size: 0.9rem;
            margin-bottom: 1.5rem; display: none;
        }
        .alert-success {
            background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: var(--success);
        }
        .alert-danger {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: var(--danger);
        }

        .form-link {
            text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8;
        }
        .form-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .form-link a:hover { text-decoration: underline; }

        footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 2rem 0; text-align: center; color: #64748b;
            font-size: 0.9rem; margin-top: 4rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Parqueo<span>Airbin</span></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item d-none" id="navRegistro"><a class="nav-link" href="registro.html">Registro</a></li>
                    <li class="nav-item d-none" id="navLogin"><a class="nav-link active" href="login.html">Iniciar Sesión</a></li>
                    <li class="nav-item d-none" id="navPanel"><a class="nav-link" href="dashboard.html">Ir a mi Panel</a></li>
                    <li class="nav-item d-none" id="navLogout"><a class="nav-link" href="#" id="btnLogout" style="color:var(--danger)">Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-wrapper">
            <div class="form-card">
                <h2>Iniciar sesión</h2>
                <p class="subtitle">Ingresa tus credenciales para acceder</p>

                <div id="alertSuccess" class="alert-custom alert-success" role="alert"></div>
                <div id="alertError" class="alert-custom alert-danger" role="alert"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" class="form-control-custom" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" id="contrasena" class="form-control-custom" placeholder="Tu contraseña" required>
                    </div>

                    <button type="submit" id="btnLogin" class="btn-submit">Iniciar sesión</button>
                </form>

                <div class="form-link">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            &copy; 2026 ParqueoAirbin — Todos los derechos reservados.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form         = document.getElementById('loginForm');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError   = document.getElementById('alertError');
        const btnLogin     = document.getElementById('btnLogin');

        // Check if already logged in
        (function() {
            const userData = localStorage.getItem('usuario');
            if (userData) {
                document.getElementById('navPanel').classList.remove('d-none');
                document.getElementById('navLogout').classList.remove('d-none');
                document.getElementById('btnLogout').addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('usuario');
                    window.location.reload();
                });
                // Redirect logged-in users away from login page
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('navRegistro').classList.remove('d-none');
                document.getElementById('navLogin').classList.remove('d-none');
            }
        })();

        function showAlert(element, message) {
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
            element.textContent = message;
            element.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const correo     = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value;

            if (!correo || !contrasena) {
                showAlert(alertError, 'Por favor, completa todos los campos.');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = 'Ingresando...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contrasena })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert(alertSuccess, `✅ ${data.mensaje} Bienvenido, ${data.usuario.nombre}.`);
                    // Guardar datos del usuario en localStorage (incluye id, nombre, correo, rol)
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    // Redirigir al dashboard siempre
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showAlert(alertError, data.mensaje || 'Error al iniciar sesión.');
                }
            } catch (err) {
                showAlert(alertError, 'No se pudo conectar con el servidor. Intenta más tarde.');
                console.error(err);
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
