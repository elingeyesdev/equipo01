<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta en EstAirbnb — la plataforma de alquiler de parqueos.">
  <title>Crear Cuenta · EstAirbnb</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent:       #1877f2;
      --accent-hover: #166fe5;
      --body-bg:      #f0f2f5;
      --card-border:  #e4e6eb;
      --text-primary: #1c1e21;
      --text-muted:   #65676b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--body-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 60px; height: 60px;
      background: var(--accent);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(24,119,242,0.35);
    }
    .brand h1 { font-size: 1.6rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
    .brand p  { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    .auth-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      text-align: center;
    }
    .auth-card .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .row-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0; }

    .input-group-custom {
      position: relative;
      margin-bottom: 14px;
    }
    .input-group-custom .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 2;
    }
    .input-group-custom input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.938rem;
      color: var(--text-primary);
      background: #fafbfc;
      transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
    }
    .input-group-custom input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24,119,242,0.15);
      background: #fff;
    }
    .input-group-custom input.is-invalid {
      border-color: #dc3545;
      box-shadow: 0 0 0 3px rgba(220,53,69,0.12);
    }
    .field-error {
      font-size: 0.78rem; color: #dc3545;
      margin-top: 4px; display: none;
    }
    .field-error.show { display: block; }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: var(--text-muted);
      font-size: 0.9rem; z-index: 2;
      background: none; border: none; padding: 0;
    }
    .toggle-pw:hover { color: var(--accent); }

    /* Strength bar */
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--card-border);
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }
    .strength-label {
      font-size: 0.75rem;
      margin-top: 3px;
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(24,119,242,0.3);
    }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .alert-box {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .alert-box.error   { display: flex; background: #fff2f3; color: #c0392b; border: 1.5px solid #f5c6cb; }
    .alert-box.success { display: flex; background: #f0faf4; color: #1a7a42; border: 1.5px solid #b7dfcb; }

    .terms {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
    }

    .divider {
      display: flex; align-items: center;
      gap: 12px; margin: 20px 0;
      color: var(--text-muted); font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--card-border);
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .auth-footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-square-parking"></i></div>
    <h1>EstAirbnb</h1>
    <p>Tu plataforma de alquiler de parqueos</p>
  </div>

  <div class="auth-card">
    <h2>Crear cuenta</h2>
    <p class="subtitle">Es rápido y sencillo</p>

    <div class="alert-box" id="alertBox">
      <i class="fa-solid fa-circle-exclamation" id="alertIcon"></i>
      <span id="alertMsg"></span>
    </div>

    <form id="registerForm" novalidate>

      <!-- Nombre y Apellidos -->
      <div class="row-fields">
        <div class="input-group-custom" style="margin-bottom:0;">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="inpNombre" placeholder="Nombre" maxlength="100" required>
          <span class="field-error" id="errNombre">Mín. 2 caracteres.</span>
        </div>
        <div class="input-group-custom" style="margin-bottom:0;">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="inpApellidos" placeholder="Apellidos" maxlength="100" required>
          <span class="field-error" id="errApellidos">Mín. 2 caracteres.</span>
        </div>
      </div>
      <div style="margin-bottom:14px;"></div>

      <!-- Email -->
      <div class="input-group-custom">
        <i class="fa-solid fa-envelope field-icon"></i>
        <input type="email" id="inpEmail" placeholder="Correo electrónico" autocomplete="email" required>
        <span class="field-error" id="errEmail">Correo no válido.</span>
      </div>

      <!-- Teléfono (opcional) -->
      <div class="input-group-custom">
        <i class="fa-solid fa-phone field-icon"></i>
        <input type="tel" id="inpTelefono" placeholder="Teléfono (opcional)" maxlength="20">
      </div>

      <!-- Contraseña -->
      <div class="input-group-custom">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="inpPassword" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="new-password" required>
        <button type="button" class="toggle-pw" id="togglePw">
          <i class="fa-solid fa-eye" id="eyeIcon"></i>
        </button>
        <span class="field-error" id="errPassword">Mín. 6 caracteres.</span>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="input-group-custom">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="inpConfirm" placeholder="Confirmar contraseña" autocomplete="new-password" required>
        <span class="field-error" id="errConfirm">Las contraseñas no coinciden.</span>
      </div>

      <button type="submit" class="btn-submit" id="btnRegister">
        <i class="fa-solid fa-user-plus"></i>
        Crear cuenta
      </button>

      <p class="terms">Al registrarte aceptas los <a href="#" style="color:var(--accent);">Términos de uso</a> de EstAirbnb.</p>

    </form>

    <div class="divider">¿Ya tienes cuenta?</div>

    <div class="auth-footer">
      <a href="/login.html">Iniciar sesión</a>
    </div>
  </div>

  <script>
    const USUARIO_KEY = 'estairbnb_user';

    if (localStorage.getItem(USUARIO_KEY)) {
      window.location.href = '/configuracion.html';
    }

    // Toggle password
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw   = document.getElementById('inpPassword');
      const icon = document.getElementById('eyeIcon');
      const show = pw.type === 'password';
      pw.type    = show ? 'text' : 'password';
      icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    // Indicador de fortaleza
    document.getElementById('inpPassword').addEventListener('input', function () {
      const v = this.value;
      let score = 0;
      if (v.length >= 6)  score++;
      if (v.length >= 10) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const fill   = document.getElementById('strengthFill');
      const label  = document.getElementById('strengthLabel');
      const colors = ['#dc3545','#fd7e14','#ffc107','#28a745','#1a7a42'];
      const labels = ['Muy débil','Débil','Aceptable','Fuerte','Muy fuerte'];
      fill.style.width      = `${(score / 5) * 100}%`;
      fill.style.background = colors[score - 1] || '#e4e6eb';
      label.textContent     = score > 0 ? labels[score - 1] : '';
    });

    function showAlert(msg, type = 'error') {
      const box  = document.getElementById('alertBox');
      const icon = document.getElementById('alertIcon');
      box.className = `alert-box ${type}`;
      icon.className = type === 'error'
        ? 'fa-solid fa-circle-exclamation'
        : 'fa-solid fa-circle-check';
      document.getElementById('alertMsg').textContent = msg;
    }
    function hideAlert() { document.getElementById('alertBox').className = 'alert-box'; }

    function setFieldError(id, errId, show) {
      document.getElementById(id).classList.toggle('is-invalid', show);
      document.getElementById(errId).classList.toggle('show', show);
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const nombre    = document.getElementById('inpNombre').value.trim();
      const apellidos = document.getElementById('inpApellidos').value.trim();
      const email     = document.getElementById('inpEmail').value.trim();
      const telefono  = document.getElementById('inpTelefono').value.trim();
      const password  = document.getElementById('inpPassword').value;
      const confirm   = document.getElementById('inpConfirm').value;

      // Validaciones
      let valid = true;
      setFieldError('inpNombre',    'errNombre',    nombre.length < 2);    if (nombre.length    < 2) valid = false;
      setFieldError('inpApellidos', 'errApellidos', apellidos.length < 2); if (apellidos.length < 2) valid = false;
      setFieldError('inpEmail',     'errEmail',     !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) valid = false;
      setFieldError('inpPassword', 'errPassword', password.length < 6); if (password.length < 6) valid = false;
      setFieldError('inpConfirm',  'errConfirm',  password !== confirm);  if (password !== confirm)  valid = false;
      if (!valid) return;

      const btn = document.getElementById('btnRegister');
      const origHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Creando cuenta...`;

      try {
        const res  = await fetch('/api/auth/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ nombre, apellidos, email, password, telefono }),
        });
        const data = await res.json();

        if (res.ok && data.status === 'ok') {
          // Guardar sesión y redirigir
          localStorage.setItem(USUARIO_KEY, JSON.stringify(data.data));
          showAlert('¡Cuenta creada! Redirigiendo...', 'success');
          setTimeout(() => { window.location.href = '/configuracion.html'; }, 900);
        } else {
          showAlert(data.message || 'Error al crear la cuenta.');
          btn.disabled = false;
          btn.innerHTML = origHTML;
        }
      } catch (err) {
        showAlert('No se pudo conectar con el servidor.');
        btn.disabled = false;
        btn.innerHTML = origHTML;
      }
    });
  </script>

</body>
</html>
